# Generated by lsp-mcp enroll; project-scoped and read-only by default.
# The router writes only a host-local mcpls runtime configuration, then execs mcpls.

[mcp_servers.lsp_mcpls]
command = "/home/vlad/.local/bin/lsp-mcp"
args = ["serve", "--profile", "/home/vlad/.config/lsp-mcp/profile.toml"]
enabled = true
required = false
startup_timeout_sec = 45
tool_timeout_sec = 180
enabled_tools = ["get_definition", "get_references", "get_document_symbols", "get_hover", "get_diagnostics", "prepare_call_hierarchy", "get_incoming_calls", "get_outgoing_calls", "workspace_symbol_search"]
default_tools_approval_mode = "auto"
env_vars = ["CARGO_HOME", "HOME", "LSP_WORKSPACE_ROOT", "PATH", "RUSTUP_HOME", "RUSTUP_TOOLCHAIN", "RUST_ANALYZER_BIN"]
