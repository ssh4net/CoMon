[package]
name = "comon"
version = "0.3.4"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.56", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
